<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Japan Core Y2K Calc ♡</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente cute / retro de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
    <div id="calculator">
        <div class="header">
            <span class="cute-title">໒꒰˵- ˕ -˵꒱১</span>
            <span class="sub-title">★ 2000s edition ★</span>
        </div>
        
        <input type="text" id="display" placeholder="0" readonly>
        
        <div class="buttons">
            <button id="ac" class="operator func">AC</button>
            <button id="de" class="operator func">DEL</button>
            <button id="." class="operator">.</button>
            <button id="/" class="operator">÷</button>
            
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button id="*" class="operator">×</button>
            
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="-" class="operator">-</button>
            
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="+" class="operator">+</button>
            
            <button id="00">00</button>
            <button id="0">0</button>
            <button id="=" class="equal operator">=</button>
        </div>
        <div class="footer">♡ kawaii cyber-core ♡</div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
